<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.22" r="0.68">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>

  <!-- Shopping bag icon in white -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2">
    <!-- Bag body -->
    <path d="M8 10 L6.5 26 H25.5 L24 10 Z"/>
    <!-- Bag top edge -->
    <line x1="6.5" y1="10" x2="25.5" y2="10"/>
    <!-- Bag handle -->
    <path d="M12 10 C12 7 13.5 5.5 16 5.5 C18.5 5.5 20 7 20 10"/>
  </g>
</svg>
